<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        /* ========== CSS ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #888;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        /* Stats */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        .stat {
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 10px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #score { color: #2ecc71; }
        #high-score { color: #f39c12; }

        /* Game Canvas */
        canvas {
            border: 3px solid #2ecc71;
            border-radius: 10px;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            display: block;
            margin: 0 auto 15px;
        }

        /* Controls hint */
        .controls {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .controls span {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 5px;
            margin: 0 2px;
        }

        /* Buttons */
        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2ecc71;
            color: white;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        /* Mobile controls */
        .mobile-controls {
            display: none;
            margin-top: 15px;
        }

        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mobile-btn:active {
            background: rgba(46, 204, 113, 0.4);
        }

        /* Game Over Overlay */
        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 20px;
            border: 2px solid #e74c3c;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #e74c3c;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .game-over p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* Responsive */
        @media (max-width: 450px) {
            canvas {
                width: 90vw;
                height: 90vw;
            }
            .mobile-controls {
                display: block;
            }
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- ========== HTML ========== -->
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <p class="subtitle">Eat the food, grow longer, don't crash!</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Best</div>
                <div class="stat-value" id="high-score">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <p class="controls">Use <span>↑</span> <span>↓</span> <span>←</span> <span>→</span> or <span>W</span> <span>A</span> <span>S</span> <span>D</span> to move</p>

        <!-- Mobile Controls -->
        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="mobile-btn" id="btn-up">↑</button>
            </div>
            <div class="mobile-row">
                <button class="mobile-btn" id="btn-left">←</button>
                <button class="mobile-btn" id="btn-down">↓</button>
                <button class="mobile-btn" id="btn-right">→</button>
            </div>
        </div>

        <button class="btn" id="start-btn">▶️ Start Game</button>

        <!-- Game Over Overlay -->
        <div class="game-over" id="game-over">
            <h2>💥 Game Over!</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" id="restart-btn">🔄 Play Again</button>
        </div>
    </div>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        // ========== GAME SETUP ==========
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Grid settings
        const gridSize = 20;      // Size of each square
        const tileCount = 20;     // 20x20 grid (400px / 20px)

        // Game state
        let snake = [{ x: 10, y: 10 }];  // Snake starts in middle
        let food = { x: 15, y: 15 };      // Food position
        let velocity = { x: 0, y: 0 };    // Current direction
        let nextVelocity = { x: 0, y: 0 }; // Next direction (prevents quick double-taps)
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop = null;

        // DOM elements
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverDiv = document.getElementById('game-over');
        const finalScoreSpan = document.getElementById('final-score');

        // Show high score
        highScoreDisplay.textContent = highScore;

        // ========== DRAWING FUNCTIONS ==========

        // Draw the game
        function draw() {
            // Clear canvas
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines (subtle)
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            // Draw snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head - brighter green
                    ctx.fillStyle = '#2ecc71';
                    ctx.shadowColor = '#2ecc71';
                    ctx.shadowBlur = 10;
                } else {
                    // Body - darker green
                    ctx.fillStyle = '#27ae60';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });
            ctx.shadowBlur = 0; // Reset shadow

            // Draw food
            ctx.fillStyle = '#e74c3c';
            ctx.shadowColor = '#e74c3c';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // ========== GAME LOGIC ==========

        // Update game state
        function update() {
            if (!gameRunning) return;

            // Apply next velocity
            velocity = { ...nextVelocity };

            // Calculate new head position
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Check wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // Check self collision
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // Add new head
            snake.unshift(head);

            // Check food collision
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = score;
                placeFood();
            } else {
                // Remove tail if no food eaten
                snake.pop();
            }
        }

        // Place food randomly (not on snake)
        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                validPosition = true;
                // Make sure food doesn't spawn on snake
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);

            // Update high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }

            finalScoreSpan.textContent = score;
            gameOverDiv.classList.add('show');
        }

        // Start game
        function startGame() {
            // Reset state
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            nextVelocity = { x: 0, y: 0 };
            score = 0;
            scoreDisplay.textContent = score;
            placeFood();

            gameRunning = true;
            gameOverDiv.classList.remove('show');
            startBtn.textContent = '⏸️ Pause';

            // Game loop: update 10 times per second
            gameLoop = setInterval(() => {
                update();
                draw();
            }, 100);
        }

        // ========== CONTROLS ==========

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (!gameRunning && e.key !== ' ') return;

            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (velocity.y !== 1) { // Can't go down if going up
                        nextVelocity = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (velocity.y !== -1) {
                        nextVelocity = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (velocity.x !== 1) {
                        nextVelocity = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (velocity.x !== -1) {
                        nextVelocity = { x: 1, y: 0 };
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    if (!gameRunning && !gameOverDiv.classList.contains('show')) {
                        startGame();
                    }
                    break;
            }
        });

        // Mobile controls
        document.getElementById('btn-up').addEventListener('click', () => {
            if (velocity.y !== 1) nextVelocity = { x: 0, y: -1 };
        });
        document.getElementById('btn-down').addEventListener('click', () => {
            if (velocity.y !== -1) nextVelocity = { x: 0, y: 1 };
        });
        document.getElementById('btn-left').addEventListener('click', () => {
            if (velocity.x !== 1) nextVelocity = { x: -1, y: 0 };
        });
        document.getElementById('btn-right').addEventListener('click', () => {
            if (velocity.x !== -1) nextVelocity = { x: 1, y: 0 };
        });

        // Button events
        startBtn.addEventListener('click', () => {
            if (!gameRunning) {
                startGame();
            }
        });

        restartBtn.addEventListener('click', () => {
            gameOverDiv.classList.remove('show');
            startGame();
        });

        // Initial draw
        draw();
    </script>
</body>
</html>
