<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .game-container {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .subtitle {
            color: #888;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
        }

        .stat {
            background: rgba(255,255,255,0.1);
            padding: 10px 25px;
            border-radius: 10px;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        #score { color: #2ecc71; }
        #high-score { color: #f39c12; }

        canvas {
            border: 3px solid #2ecc71;
            border-radius: 10px;
            background: #0a0a0a;
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.3);
            display: block;
            margin: 0 auto 15px;
        }

        .controls {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        .controls span {
            background: rgba(255,255,255,0.1);
            padding: 3px 8px;
            border-radius: 5px;
            margin: 0 2px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2ecc71;
            color: white;
            transition: all 0.3s;
            margin: 5px;
        }

        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .mobile-controls {
            display: none;
            margin-top: 15px;
        }

        .mobile-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 5px 0;
        }

        .mobile-btn {
            width: 60px;
            height: 60px;
            font-size: 1.5rem;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 15px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .mobile-btn:active {
            background: rgba(46, 204, 113, 0.4);
        }

        .game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 30px 50px;
            border-radius: 20px;
            border: 2px solid #e74c3c;
            text-align: center;
        }

        .game-over.show {
            display: block;
        }

        .game-over h2 {
            color: #e74c3c;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .game-over p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .start-hint {
            color: #2ecc71;
            font-size: 1rem;
            margin-top: 10px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @media (max-width: 450px) {
            canvas {
                width: 90vw;
                height: 90vw;
            }
            .mobile-controls {
                display: block;
            }
            .controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        <p class="subtitle">Eat the food, grow longer, don't crash!</p>

        <div class="stats">
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Best</div>
                <div class="stat-value" id="high-score">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <p class="controls">Use <span>↑</span> <span>↓</span> <span>←</span> <span>→</span> or <span>W</span> <span>A</span> <span>S</span> <span>D</span> to move</p>

        <div class="mobile-controls">
            <div class="mobile-row">
                <button class="mobile-btn" id="btn-up">↑</button>
            </div>
            <div class="mobile-row">
                <button class="mobile-btn" id="btn-left">←</button>
                <button class="mobile-btn" id="btn-down">↓</button>
                <button class="mobile-btn" id="btn-right">→</button>
            </div>
        </div>

        <button class="btn" id="start-btn">▶️ Start Game</button>
        <p class="start-hint" id="start-hint" style="display: none;">👆 Tap a direction arrow to begin!</p>

        <div class="game-over" id="game-over">
            <h2>💥 Game Over!</h2>
            <p>Score: <span id="final-score">0</span></p>
            <button class="btn" id="restart-btn">🔄 Play Again</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const gridSize = 20;
        const tileCount = 20;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let velocity = { x: 0, y: 0 };
        let nextVelocity = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameStarted = false; // NEW: tracks if player has pressed a direction
        let gameLoop = null;

        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('high-score');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const gameOverDiv = document.getElementById('game-over');
        const finalScoreSpan = document.getElementById('final-score');
        const startHint = document.getElementById('start-hint');

        highScoreDisplay.textContent = highScore;

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 1;
            for (let i = 0; i < tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }

            snake.forEach((segment, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#2ecc71';
                    ctx.shadowColor = '#2ecc71';
                    ctx.shadowBlur = 10;
                } else {
                    ctx.fillStyle = '#27ae60';
                    ctx.shadowBlur = 0;
                }
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
            });
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#e74c3c';
            ctx.shadowColor = '#e74c3c';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        function update() {
            if (!gameRunning) return;

            // Only move if player has chosen a direction
            if (!gameStarted) return;

            velocity = { ...nextVelocity };

            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = score;
                placeFood();
            } else {
                snake.pop();
            }
        }

        function placeFood() {
            let validPosition = false;
            while (!validPosition) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);

                validPosition = true;
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        validPosition = false;
                        break;
                    }
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            gameStarted = false;
            clearInterval(gameLoop);

            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreDisplay.textContent = highScore;
            }

            finalScoreSpan.textContent = score;
            gameOverDiv.classList.add('show');
            startBtn.textContent = '▶️ Start Game';
            startBtn.disabled = false;
            startHint.style.display = 'none';
        }

        function startGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            nextVelocity = { x: 0, y: 0 };
            score = 0;
            scoreDisplay.textContent = score;
            placeFood();

            gameRunning = true;
            gameStarted = false; // Wait for direction input
            gameOverDiv.classList.remove('show');
            startBtn.textContent = '⏸️ Playing...';
            startBtn.disabled = true;
            startHint.style.display = 'block';

            gameLoop = setInterval(() => {
                update();
                draw();
            }, 100);
        }

        function setDirection(newVelocity) {
            // Only allow direction change if game is running
            if (!gameRunning) return;

            // Prevent reversing directly
            if (newVelocity.x !== 0 && velocity.x === -newVelocity.x) return;
            if (newVelocity.y !== 0 && velocity.y === -newVelocity.y) return;

            nextVelocity = newVelocity;

            // First direction press starts the movement
            if (!gameStarted) {
                gameStarted = true;
                startHint.style.display = 'none';
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    e.preventDefault();
                    setDirection({ x: 0, y: -1 });
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    e.preventDefault();
                    setDirection({ x: 0, y: 1 });
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    e.preventDefault();
                    setDirection({ x: -1, y: 0 });
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    e.preventDefault();
                    setDirection({ x: 1, y: 0 });
                    break;
            }
        });

        // Mobile controls
        document.getElementById('btn-up').addEventListener('click', () => setDirection({ x: 0, y: -1 }));
        document.getElementById('btn-down').addEventListener('click', () => setDirection({ x: 0, y: 1 }));
        document.getElementById('btn-left').addEventListener('click', () => setDirection({ x: -1, y: 0 }));
        document.getElementById('btn-right').addEventListener('click', () => setDirection({ x: 1, y: 0 }));

        startBtn.addEventListener('click', () => {
            if (!gameRunning) {
                startGame();
            }
        });

        restartBtn.addEventListener('click', () => {
            gameOverDiv.classList.remove('show');
            startGame();
        });

        draw();
    </script>
</body>
</html>
